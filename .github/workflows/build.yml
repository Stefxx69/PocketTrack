name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTrack-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  blender-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip add-on
        run: |
          mkdir -p dist
          cd blender_addon/pockettrack
          zip -r ../../dist/pockettrack-addon.zip . -x "__pycache__/*"
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTrack-blender-addon
          path: dist/pockettrack-addon.zip
